<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreamcatcher</title>
<meta name="description" content="Dreamcatcher: every app, in the picture. Browse apps the way you browse a streaming service.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07060D">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.mjs"></script>
</head>
<body class="is-booting">
<canvas id="sky" aria-hidden="true"></canvas>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar" id="topbar">
  <div class="topbar-left">
    <button class="browse-btn" id="browse-open" type="button" aria-expanded="false" aria-controls="browse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Browse</span>
    </button>
    <a class="brand" href="#home" aria-label="Dreamcatcher home"><span class="brand-mark" id="brand-mark"></span><span class="brand-word">dreamcatcher</span></a>
  </div>
  <nav class="topbar-right" aria-label="Your Dreamcatcher">
    <a class="icon-link" href="#search" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></a>
    <a class="icon-link" href="#my-stuff" aria-label="My Stuff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1Z"/></svg><span class="count" id="list-count" hidden></span></a>
    <a class="create-link" href="#studio/new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New app</span></a>
    <div class="profile"><button class="avatar" id="profile-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu"><span id="avatar-initial" aria-hidden="true">·</span><span class="sr">Profile and settings</span></button><div class="menu" id="profile-menu" hidden></div></div>
  </nav>
</header>

<div class="browse-scrim" id="browse-scrim" hidden></div>
<aside class="browse" id="browse" aria-label="Browse" hidden>
  <div class="browse-head"><span class="brand-mark" id="browse-mark"></span><button class="icon-link" type="button" id="browse-close" aria-label="Close browse menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <nav aria-label="Browse">
    <a href="#home">Home</a>
    <a href="#home" data-jump="rail-new">New on Dreamcatcher</a>
    <a href="#home" data-jump="rail-top">Top 10</a>
    <a href="#home" data-jump="rail-originals">Dreamcatcher Originals</a>
    <p class="browse-group">Domains</p>
    <div id="browse-domains"></div>
    <p class="browse-group">You</p>
    <a href="#my-stuff">My Stuff</a>
    <a href="#studio/new">Create an app</a>
    <a href="#studio" data-role="creator">Your apps</a>
    <a href="#admin" data-role="admin">Site admin</a>
    <a href="#search">Search</a>
  </nav>
</aside>

<main id="main" tabindex="-1"></main>

<footer class="footer">
  <a class="footer-brand" href="#home"><span class="brand-mark" id="footer-mark"></span>dreamcatcher</a>
  <p>Sample catalog. Apps, owners, rankings and graphs are illustrative, for design review.</p>
  <button class="link-button" type="button" id="about-open">About this prototype</button>
</footer>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-mark" id="intro-mark"></div>
  <div class="intro-word">dreamcatcher</div>
  <button class="intro-skip" type="button" id="intro-skip" tabindex="-1">Skip</button>
</div>

<dialog id="about" aria-labelledby="about-title"><div id="about-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
